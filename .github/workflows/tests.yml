name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install bot
        run: python -m pip install -r requirements.lock && python -m pip install --no-deps --no-build-isolation -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -t tests -v

      - name: Verify dashboard rendering and filters
        run: node tests/dashboard_ui.cjs
