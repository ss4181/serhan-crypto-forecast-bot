name: BTC ETH Cloud Bot

on:
  schedule:
    # GitHub drops most of a */5 schedule and bills private-repo minutes by the
    # minute, so this job is a standby that keeps research and the panel warm.
    # Minute-accurate alerting is the always-on host's job (see deploy/).
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      force_research:
        description: "Haftalık aralığı beklemeden 365 günlük walk-forward araştırmayı zorla"
        required: false
        default: false
        type: boolean
      telegram_test:
        description: "Telegram bağlantı test mesajı gönder"
        required: false
        default: false
        type: boolean
      verify_models:
        description: "Altı modelin de kanala mesaj ürettiğini doğrula"
        required: false
        default: false
        type: boolean

concurrency:
  group: btc-eth-cloud-bot
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CRYPTO_TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
      CRYPTO_TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
      CRYPTO_TELEGRAM_OWNER_ID: ${{ secrets.CRYPTO_TELEGRAM_OWNER_ID }}
      # The always-on host is the only sender.  Leaving this job on "primary"
      # while the VM runs would double every alert and make both sides fight
      # over getUpdates.  Set the repository variable to "primary" only if the
      # VM is gone and you want Actions to take over.
      CRYPTO_BOT_ROLE: ${{ vars.CRYPTO_BOT_ROLE || 'standby' }}
      PROJECT_HUB_INGEST_URL: ${{ secrets.PROJECT_HUB_INGEST_URL }}
      PROJECT_HUB_INGEST_TOKEN: ${{ secrets.PROJECT_HUB_INGEST_TOKEN }}
      OAI_SITES_BYPASS_TOKEN: ${{ secrets.OAI_SITES_BYPASS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Select hourly candle cache
        id: candle-key
        shell: bash
        run: echo "value=crypto-candles-${RUNNER_OS}-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      # Candles are large but self-healing: update_cache re-fetches from the last
      # cached bar, so losing an hour costs a handful of requests.
      - uses: actions/cache@v4
        with:
          path: data
          key: ${{ steps.candle-key.outputs.value }}
          restore-keys: |
            crypto-candles-${{ runner.os }}-

      # Delivery receipts and model bundles must survive *every* run.  On an exact
      # key hit actions/cache skips the save, so a shared hourly key silently threw
      # away the receipts written by all but the first run of each hour and the
      # same alert went out again.  A per-run key is always a miss, always saves,
      # and these paths are only tens of kilobytes.
      - uses: actions/cache@v4
        with:
          path: |
            artifacts
            state
          key: crypto-signals-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            crypto-signals-${{ runner.os }}-

      - name: Install bot
        run: python -m pip install -e .

      - name: Send Telegram connection test
        if: ${{ inputs.telegram_test == true }}
        run: python run.py telegram-test

      - name: Verify every model reaches Telegram
        if: ${{ inputs.verify_models == true }}
        run: python run.py verify-models --refresh --days 365 --send

      - name: Refresh, forecast and notify
        shell: bash
        run: |
          extra=""
          if [[ "${{ inputs.force_research }}" == "true" ]]; then extra="--force-research"; fi
          python run.py cloud-run --days 365 $extra

      - name: Prepare public signal dashboard
        run: python run.py dashboard-export --output docs/scalp-data.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish GitHub Pages dashboard
        id: deployment
        uses: actions/deploy-pages@v4
