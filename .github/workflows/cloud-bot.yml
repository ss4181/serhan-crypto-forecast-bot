name: BTC ETH Cloud Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_research:
        description: "365 günlük walk-forward araştırmayı zorla"
        required: false
        default: false
        type: boolean
      telegram_test:
        description: "Telegram bağlantı test mesajı gönder"
        required: false
        default: false
        type: boolean
      verify_models:
        description: "Altı modelin de kanala mesaj ürettiğini doğrula"
        required: false
        default: false
        type: boolean

concurrency:
  group: btc-eth-cloud-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRYPTO_TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
      CRYPTO_TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
      CRYPTO_TELEGRAM_OWNER_ID: ${{ secrets.CRYPTO_TELEGRAM_OWNER_ID }}
      PROJECT_HUB_INGEST_URL: ${{ secrets.PROJECT_HUB_INGEST_URL }}
      PROJECT_HUB_INGEST_TOKEN: ${{ secrets.PROJECT_HUB_INGEST_TOKEN }}
      OAI_SITES_BYPASS_TOKEN: ${{ secrets.OAI_SITES_BYPASS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Select hourly candle cache
        id: candle-key
        shell: bash
        run: echo "value=crypto-candles-${RUNNER_OS}-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      # Candles are large but self-healing: update_cache re-fetches from the last
      # cached bar, so losing an hour costs a handful of requests.
      - uses: actions/cache@v4
        with:
          path: data
          key: ${{ steps.candle-key.outputs.value }}
          restore-keys: |
            crypto-candles-${{ runner.os }}-

      # Delivery receipts and model bundles must survive *every* run.  On an exact
      # key hit actions/cache skips the save, so a shared hourly key silently threw
      # away the receipts written by all but the first run of each hour and the
      # same alert went out again.  A per-run key is always a miss, always saves,
      # and these paths are only tens of kilobytes.
      - uses: actions/cache@v4
        with:
          path: |
            artifacts
            state
          key: crypto-signals-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            crypto-signals-${{ runner.os }}-

      - name: Install bot
        run: python -m pip install -e .

      - name: Send Telegram connection test
        if: ${{ inputs.telegram_test == true }}
        run: python run.py telegram-test

      - name: Verify every model reaches Telegram
        if: ${{ inputs.verify_models == true }}
        run: python run.py verify-models --refresh --days 365 --send

      - name: Refresh, forecast and notify
        shell: bash
        run: |
          extra=""
          if [[ "${{ inputs.force_research }}" == "true" ]]; then extra="--force-research"; fi
          python run.py cloud-run --days 365 $extra
